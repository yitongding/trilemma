<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Linear Gradients for the three sides to create a glowing impossible/continuous loop -->
    <linearGradient id="side-indigo" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="side-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="side-amber" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    
    <!-- Glow Filters for Neon Look -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing Geometric Triangle -->
  <g transform="translate(0, 20)">
    <!-- Base glowing back lines -->
    <polygon points="256,60 456,400 56,400" fill="none" stroke="url(#side-indigo)" stroke-width="24" stroke-linejoin="round" opacity="0.4" filter="url(#neon-glow)" />
    
    <!-- Interlocking outer Penrose-style triangle segments -->
    <!-- Segment 1: Bottom to Top-Left -->
    <path d="M 56 400 L 256 60 L 276 95 L 106 390 Z" fill="url(#side-indigo)" />
    
    <!-- Segment 2: Top to Bottom-Right -->
    <path d="M 256 60 L 456 400 L 406 400 L 236 95 Z" fill="url(#side-emerald)" />
    
    <!-- Segment 3: Bottom-Right to Bottom-Left -->
    <path d="M 456 400 L 56 400 L 106 390 L 406 390 Z" fill="url(#side-amber)" />

    <!-- A central delicate geometric wireframe triangle that echoes "The Impossible Trilemma" -->
    <polygon points="256,130 396,370 116,370" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" opacity="0.25" />
    
    <!-- Inner glowing core dot representing the center of decision gravity -->
    <circle cx="256" cy="290" r="16" fill="#ffffff" filter="url(#neon-glow)" />
  </g>
</svg>